<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="hdrG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <clipPath id="pc1"><rect x="3" y="37" width="554" height="320" rx="13"/></clipPath>
    <clipPath id="pc2"><rect x="3" y="37" width="554" height="320" rx="13"/></clipPath>
    <clipPath id="pc3"><rect x="3" y="37" width="554" height="320" rx="13"/></clipPath>
    <clipPath id="pc4"><rect x="3" y="37" width="554" height="320" rx="13"/></clipPath>
    <g id="uncle">
      <rect x="-16" y="-36" width="11" height="36" rx="4" fill="#334155"/>
      <rect x="5" y="-36" width="11" height="36" rx="4" fill="#334155"/>
      <rect x="-34" y="-98" width="12" height="50" rx="6" fill="#6d28d9"/>
      <rect x="22" y="-98" width="12" height="50" rx="6" fill="#6d28d9"/>
      <circle cx="-28" cy="-44" r="6.5" fill="#fcd9b8"/>
      <circle cx="28" cy="-44" r="6.5" fill="#fcd9b8"/>
      <rect x="-25" y="-104" width="50" height="72" rx="15" fill="#7c3aed"/>
      <circle cx="0" cy="-122" r="25" fill="#fcd9b8"/>
      <path d="M-25,-124 a25,25 0 0 1 50,0 z" fill="#e2e8f0"/>
      <circle cx="-10" cy="-120" r="7.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
      <circle cx="10" cy="-120" r="7.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
      <line x1="-3" y1="-120" x2="3" y2="-120" stroke="#1e293b" stroke-width="1.6"/>
      <circle cx="-10" cy="-120" r="2" fill="#1e293b"/>
      <circle cx="10" cy="-120" r="2" fill="#1e293b"/>
      <path d="M-6,-108 q6,4 12,0" stroke="#b45309" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="-102" rx="9" ry="4.5" fill="#e2e8f0"/>
    </g>
    <g id="ben">
      <rect x="-15" y="-32" width="11" height="32" rx="4" fill="#1e293b"/>
      <rect x="4" y="-32" width="11" height="32" rx="4" fill="#1e293b"/>
      <rect x="-33" y="-94" width="12" height="48" rx="6" fill="#0284c7"/>
      <rect x="21" y="-94" width="12" height="48" rx="6" fill="#0284c7"/>
      <circle cx="-27" cy="-42" r="6" fill="#fcd9b8"/>
      <circle cx="27" cy="-42" r="6" fill="#fcd9b8"/>
      <rect x="-24" y="-100" width="48" height="70" rx="15" fill="#0ea5e9"/>
      <path d="M-24,-88 q24,14 48,0" stroke="#7dd3fc" stroke-width="3" fill="none"/>
      <circle cx="0" cy="-118" r="23" fill="#fcd9b8"/>
      <path d="M-23,-120 a23,23 0 0 1 46,0 z" fill="#0f172a"/>
      <path d="M-14,-136 l3,-10 5,8 z" fill="#0f172a"/>
      <path d="M6,-138 l4,-10 5,9 z" fill="#0f172a"/>
      <circle cx="-8" cy="-116" r="2.4" fill="#1e293b"/>
      <circle cx="8" cy="-116" r="2.4" fill="#1e293b"/>
      <ellipse cx="0" cy="-104" rx="4" ry="5" fill="#7c2d12"/>
    </g>
  </defs>

  <rect width="1200" height="840" fill="url(#bgG)"/>

  <!-- 头部横幅 -->
  <rect x="20" y="16" width="1160" height="56" rx="14" fill="url(#hdrG)"/>
  <rect x="36" y="28" width="88" height="32" rx="9" fill="#f97316"/>
  <text x="80" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.06</text>
  <text x="142" y="52" font-size="25" font-weight="bold" fill="#ffffff">Vue 后厨的智慧 —— Vue 专项优化</text>
  <text x="1164" y="50" text-anchor="end" font-size="14" fill="#cbd5e1">性能小镇 · 配套文档 docs/06-vue.md</text>

  <!-- 第 1 格 · Proxy 精准更新 -->
  <g transform="translate(20,84)">
    <rect width="560" height="360" rx="16" fill="#ffffff"/>
    <g clip-path="url(#pc1)">
      <rect x="3" y="37" width="554" height="320" fill="#ecfdf5"/>
      <rect x="3" y="330" width="554" height="27" fill="#94a3b8"/>
      <rect x="30" y="70" width="220" height="140" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
      <text x="140" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">老办法：整仓库搬一遍</text>
      <rect x="50" y="120" width="36" height="36" rx="4" fill="#fecaca"/>
      <rect x="92" y="112" width="36" height="36" rx="4" fill="#fee2e2"/>
      <rect x="134" y="120" width="36" height="36" rx="4" fill="#fecaca"/>
      <rect x="176" y="112" width="36" height="36" rx="4" fill="#fee2e2"/>
      <rect x="92" y="158" width="36" height="36" rx="4" fill="#fecaca"/>
      <rect x="134" y="158" width="36" height="36" rx="4" fill="#fee2e2"/>
      <path d="M256,140 L290,140" stroke="#10b981" stroke-width="4"/>
      <path d="M280,129 L302,140 L280,151 Z" fill="#10b981"/>
      <rect x="300" y="70" width="240" height="140" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <text x="420" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">Proxy 精准更新</text>
      <rect x="320" y="112" width="200" height="28" rx="6" fill="#d1fae5"/>
      <text x="334" y="131" font-size="13" fill="#065f46">用到的数据 → 重做</text>
      <rect x="320" y="150" width="200" height="28" rx="6" fill="#f1f5f9"/>
      <text x="334" y="169" font-size="13" fill="#94a3b8">没用到的 → 不动</text>
      <use href="#uncle" transform="translate(120,330) scale(0.72)"/>
      <use href="#ben" transform="translate(196,330) scale(0.7)"/>
      <rect x="270" y="216" width="284" height="74" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
      <path d="M300,290 L324,290 L310,312 Z" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
      <rect x="296" y="284" width="16" height="8" fill="#ffffff"/>
      <text x="288" y="244" font-size="14" fill="#0f172a">Proxy 记下谁用了哪个数据，</text>
      <text x="288" y="270" font-size="14" fill="#0f172a">只有它变才喊你重做。</text>
    </g>
    <path d="M0,34 L0,16 Q0,0 16,0 L544,0 Q560,0 560,16 L560,34 Z" fill="#e2e8f0"/>
    <text x="18" y="24" font-size="16" font-weight="bold" fill="#0f172a">第 1 格 · 精准采购：只搬用到的数据</text>
    <rect width="560" height="360" rx="16" fill="none" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- 第 2 格 · 三件省力工具 -->
  <g transform="translate(608,84)">
    <rect width="560" height="360" rx="16" fill="#ffffff"/>
    <g clip-path="url(#pc2)">
      <rect x="3" y="37" width="554" height="320" fill="#f1f5f9"/>
      <rect x="24" y="64" width="166" height="120" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
      <text x="44" y="92" font-size="15" font-weight="bold" fill="#0369a1">v-memo</text>
      <text x="44" y="122" font-size="13" fill="#475569">列表里只有变化</text>
      <text x="44" y="144" font-size="13" fill="#475569">的行才重新渲染</text>
      <rect x="200" y="64" width="166" height="120" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
      <text x="220" y="92" font-size="15" font-weight="bold" fill="#0369a1">shallowRef</text>
      <text x="220" y="122" font-size="13" fill="#475569">大对象只追踪引用</text>
      <text x="220" y="144" font-size="13" fill="#475569">不深挖内部字段</text>
      <rect x="376" y="64" width="166" height="120" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
      <text x="396" y="92" font-size="15" font-weight="bold" fill="#0369a1">markRaw</text>
      <text x="396" y="122" font-size="13" fill="#475569">第三方实例别变</text>
      <text x="396" y="144" font-size="13" fill="#475569">响应式，省开销</text>
      <text x="24" y="216" font-size="13" fill="#0f172a">三件工具都在回答：这次更新真的必要吗？</text>
      <text x="24" y="242" font-size="13" fill="#475569">能跳过的更新，就是省下的帧。</text>
      <use href="#uncle" transform="translate(452,330) scale(0.7)"/>
      <use href="#ben" transform="translate(520,330) scale(0.68)"/>
    </g>
    <path d="M0,34 L0,16 Q0,0 16,0 L544,0 Q560,0 560,16 L560,34 Z" fill="#e2e8f0"/>
    <text x="18" y="24" font-size="16" font-weight="bold" fill="#0f172a">第 2 格 · 三件省力工具</text>
    <rect width="560" height="360" rx="16" fill="none" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- 第 3 格 · 备餐柜与按需取用 -->
  <g transform="translate(20,462)">
    <rect width="560" height="360" rx="16" fill="#ffffff"/>
    <g clip-path="url(#pc3)">
      <rect x="3" y="37" width="554" height="320" fill="#eff6ff"/>
      <rect x="3" y="330" width="554" height="27" fill="#cbd5e1"/>
      <rect x="34" y="64" width="220" height="134" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="144" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">备餐柜 KeepAlive</text>
      <rect x="52" y="102" width="86" height="42" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="95" y="128" text-anchor="middle" font-size="12" fill="#1e40af">页面A</text>
      <rect x="150" y="102" width="86" height="42" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="193" y="128" text-anchor="middle" font-size="12" fill="#1e40af">页面B</text>
      <text x="144" y="166" text-anchor="middle" font-size="12" fill="#475569">切回来直接端上，不重做</text>
      <text x="144" y="186" text-anchor="middle" font-size="12" fill="#475569">但要设 max，别塞爆冰箱</text>
      <rect x="300" y="64" width="240" height="134" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="420" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">按需取用</text>
      <text x="320" y="112" font-size="13" fill="#475569">unplugin-vue-components</text>
      <text x="320" y="134" font-size="13" fill="#475569">只用到的组件才打进包里</text>
      <text x="320" y="156" font-size="13" fill="#475569">图标同理按需引入</text>
      <text x="320" y="178" font-size="13" fill="#475569">首包体积立降一半</text>
      <rect x="30" y="210" width="250" height="74" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
      <path d="M60,284 L84,284 L70,306 Z" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
      <rect x="66" y="278" width="16" height="8" fill="#ffffff"/>
      <text x="48" y="238" font-size="14" fill="#0f172a">KeepAlive 是备餐柜，</text>
      <text x="48" y="264" font-size="14" fill="#0f172a">按需引入是少进货。</text>
      <use href="#uncle" transform="translate(410,330) scale(0.72)"/>
      <use href="#ben" transform="translate(490,330) scale(0.7)"/>
    </g>
    <path d="M0,34 L0,16 Q0,0 16,0 L544,0 Q560,0 560,16 L560,34 Z" fill="#e2e8f0"/>
    <text x="18" y="24" font-size="16" font-weight="bold" fill="#0f172a">第 3 格 · 备餐柜与按需取用</text>
    <rect width="560" height="360" rx="16" fill="none" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- 第 4 格 · 坑点与稳叔总结 -->
  <g transform="translate(608,462)">
    <rect width="560" height="360" rx="16" fill="#ffffff"/>
    <g clip-path="url(#pc4)">
      <rect x="3" y="37" width="554" height="320" fill="#fff7ed"/>
      <rect x="24" y="54" width="96" height="34" rx="9" fill="#f97316"/>
      <text x="72" y="77" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">坑点</text>
      <rect x="24" y="102" width="512" height="88" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
      <text x="44" y="132" font-size="15" fill="#7c2d12">shallowRef 包着大对象，却直接改内部字段——</text>
      <text x="44" y="160" font-size="15" fill="#7c2d12">引用没变，界面就不会更新。</text>
      <rect x="24" y="210" width="420" height="116" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="44" y="240" font-size="16" font-weight="bold" fill="#059669">稳叔总结</text>
      <text x="44" y="268" font-size="15" fill="#065f46">只更新该更新的，不搬整座仓库。</text>
      <text x="44" y="294" font-size="15" fill="#065f46">备餐柜与按需取用，一起压低首包。</text>
      <use href="#uncle" transform="translate(486,352) scale(0.72)"/>
      <use href="#ben" transform="translate(536,352) scale(0.7)"/>
      <text x="24" y="344" font-size="12" fill="#64748b">本格对应第 6 章 1~7 节 ｜ 详细讲解见 EP.06.md</text>
    </g>
    <path d="M0,34 L0,16 Q0,0 16,0 L544,0 Q560,0 560,16 L560,34 Z" fill="#e2e8f0"/>
    <text x="18" y="24" font-size="16" font-weight="bold" fill="#0f172a">第 4 格 · 坑点与稳叔总结</text>
    <rect width="560" height="360" rx="16" fill="none" stroke="#0f172a" stroke-width="2"/>
  </g>
</svg>
