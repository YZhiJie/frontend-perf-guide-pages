      <text x="44" y="240" font-size="16" font-weight="bold" fill="#059669">稳叔总结</text>
      <text x="44" y="268" font-size="15" fill="#065f46">大东西快出现、点了有反应、东西别乱跳。</text>
      <text x="44" y="294" font-size="15" fill="#065f46">结论一律看真实用户 p75 数据。</text>
