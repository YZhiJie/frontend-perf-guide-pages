      <rect x="492" y="196" width="30" height="40" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.6"/>
      <circle cx="507" cy="212" r="8" fill="#ef4444"/>
      <circle cx="188" cy="200" r="54" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
